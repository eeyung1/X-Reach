[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xreach-radar"
version = "0.1.0"
description = "REA capture adapter and viral root-post scout for X-Reach"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
xreach-radar = "xreach_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
