[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xreach-multimodal"
version = "0.1.0"
description = "OpenCLIP draft features, residual semantic IDs, and Phoenix propensity proxies"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
inference = ["open-clip-torch==3.3.0", "av>=14,<16"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
