[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xreach-api"
version = "0.1.0"
description = "FastAPI adapter for X-Reach scoring and placement"
requires-python = ">=3.10"
dependencies = ["fastapi[standard]>=0.115,<1.0", "pydantic>=2.7,<3.0"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
